name: Deploy WebMap (GitHub Pages)

# Publica o index.html gerado. Como a extracao depende de credenciais do Google
# Earth Engine (que nao vao para o repositorio), o fluxo padrao publica o
# index.html JA versionado. Se preferir gerar no CI, veja a nota ao final.

on:
  push:
    branches: [main]
    paths: ["index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar site (raiz com index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4

# Nota: para gerar o index.html no proprio CI seria necessario um Service Account
# do Google Earth Engine (GOOGLE_APPLICATION_CREDENTIALS via secret) e trocar
# ee.Authenticate() por ee.Initialize(credentials=...). Mantido fora por padrao.
